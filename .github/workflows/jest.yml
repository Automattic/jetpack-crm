name: JS tests

# Runs the Jest suite (tests/js) on every PR against trunk and on pushes to
# trunk. Companion to lint-php.yml and phpunit.yml; same trigger shape.
#
# The legacy browser JS in js/ is not modular, but most files guard a
# module.exports so a test can require() them. babel-jest transforms through the
# repo's babel.config.js — the same config webpack builds with — and the jsdom
# environment plus a small jQuery stub let a file load. See tests/js/.

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Jest
        run: npm run test:js
